[package]
name = "tauri-app"
version = "0.1.0"
description = "Wander(er), a desktop media manager with encrypted Telegram backup"
authors = ["rons-space"]
license = "AGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grammers-client = { git = "https://github.com/Lonami/grammers", rev = "b595a8c4fdfa5c3a8abcb5766c959ecfe30e9f6e", package = "grammers-client", default-features = false, features = ["fs"] }
grammers-session = { git = "https://github.com/Lonami/grammers", rev = "b595a8c4fdfa5c3a8abcb5766c959ecfe30e9f6e", package = "grammers-session", default-features = false, features = ["sqlite-storage"] }
tokio = { version = "1.49.0", features = ["full"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
# sqlite = "0.37.0"
notify = "6.1.1"
blake3 = "1.5.5"
# Used to verify pinned SHA-256 digests for downloaded ONNX models.
sha2 = "0.10"
log = "0.4.25"
dirs = "5.0"
dotenvy = "0.15.7"
time = { version = "0.3.44", features = ["serde", "macros", "formatting", "parsing"] }
image = "0.25"
# Optional, and deliberately not a default feature: the bridge opens an
# unauthenticated WebSocket control channel (see the `mcp-bridge` feature below).
tauri-plugin-mcp-bridge = { version = "0.7.0", optional = true }
tauri-plugin-dialog = "2.5.0"
mime_guess = "2.0.5"
tract-onnx = "0.21.7"
anyhow = "1.0.100"
ndarray = "0.16"
image_hasher = "3.1.1"
filetime = "0.2.27"
kamadak-exif = "0.5"
hostname = "0.3"
reqwest = { version = "0.12", features = ["stream", "rustls-tls"] }
futures-util = "0.3"
tokenizers = { version = "0.19", default-features = false, features = ["onig"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
rand = "0.8.5"
hex = "0.4.3"
# `derive` for `ZeroizeOnDrop` on the master key newtype.
zeroize = { version = "1.8", features = ["derive"] }

# Windows only. The DPAPI wrappers in `security/mod.rs` that use it are already
# behind `#[cfg(target_os = "windows")]`, so pulling the crate in unconditionally
# only meant a Linux or macOS build had to resolve and compile a crate it could
# never call.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[features]
default = []
# Development-only agent bridge. `tauri-plugin-mcp-bridge` starts an
# unauthenticated WebSocket server that can inject and run arbitrary JavaScript
# in the webview, which in this app means the full IPC command surface,
# including `unlock_encryption` and `get_all_config`. It must never be compiled
# into a distributed build, so it is opt-in and additionally gated on
# `debug_assertions` at the registration site in `lib.rs`.
#
#   npm run tauri dev -- --features mcp-bridge
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

# Shipped binaries only. Link-time optimization across the whole graph and a
# single codegen unit are slow to build but meaningfully smaller and faster for
# a binary that statically links ONNX Runtime, SQLite and the image stack;
# stripping symbols removes debug information that has no use in a release and
# takes tens of megabytes with it. `panic = "abort"` is deliberately not set:
# Tauri command handlers rely on unwinding to turn a panic into a rejected
# promise rather than killing the process.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
opt-level = 3
